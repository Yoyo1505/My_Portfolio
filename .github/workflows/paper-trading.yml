name: Paper trading daily update
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance
      - run: python quant-lab/paper_trading/engine.py
      - name: Commit updated ledger
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          git add quant-lab/paper_trading/data docs/paper-trading/data.json
          git diff --cached --quiet || (git commit -m "Paper trading update $(date -u +%F)" && git push)
